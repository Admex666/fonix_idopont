name: FőnixWeb Appointment Monitor

on:
  schedule:
    # Runs every 15 minutes. Note: GitHub Actions schedule can be delayed by 5-15 mins during peak hours.
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium Browser
        run: npx playwright install chromium

      - name: Run Appointment Monitor
        env:
          USERNAME: ${{ secrets.FONIX_USERNAME }}
          PASSWORD: ${{ secrets.FONIX_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_WEEKS: ${{ secrets.MAX_WEEKS || '4' }}
          CURRENT_APPOINTMENT_DATE: ${{ secrets.CURRENT_APPOINTMENT_DATE }}
        run: node monitor.js
